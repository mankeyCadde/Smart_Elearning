# Render Blueprint for the Smart Elearning Platform.
#
# Deploy with: Render Dashboard -> Blueprints -> New Blueprint Instance.
# This provisions a managed PostgreSQL database, the Django API (rootDir:
# backend) and the React frontend as a static site.
#
# NOTE: the *.onrender.com names below are fixed by this file. If a name is
# already taken globally, Render will pick a different URL and you must update
# DJANGO_ALLOWED_HOSTS, DJANGO_CORS_ALLOWED_ORIGINS, DJANGO_CSRF_TRUSTED_ORIGINS
# and FRONTEND_BASE_URL (and VITE_API_URL) to match.

databases:
  - name: smartlearn-db
    plan: free
    databaseName: smartlearn
    user: smartlearn

services:
  # ---------------------------------------------------------------------------
  # Django REST API (Gunicorn + WhiteNoise)
  # ---------------------------------------------------------------------------
  - type: web
    name: smartlearn-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartlearn-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: smartlearn-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://smartlearn-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://smartlearn-web.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://smartlearn-web.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_TRUST_PROXY_SSL
        value: "True"

  # ---------------------------------------------------------------------------
  # React frontend (Vite static site)
  # ---------------------------------------------------------------------------
  - type: web
    name: smartlearn-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://smartlearn-api.onrender.com/api
    routes:
      # SPA fallback: let the client-side router handle unknown paths.
      - type: rewrite
        source: /*
        destination: /index.html
